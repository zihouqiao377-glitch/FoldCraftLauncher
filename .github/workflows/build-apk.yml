name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不用 android-actions/setup-android：它内部会装已下架的 "tools" 包，必然失败。
      # runner 自带 SDK，这里直接用自带的 sdkmanager 装需要的组件。
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SM"
          "$SM" --version || true
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
          # NDK 允许 AGP 自行下载，装不上也不阻塞
          "$SM" "ndk;27.0.12077973" || echo "NDK 预装失败，交给 AGP 自动下载"

      # FCL 的 FCLKey 签名配置要读 FCL_KEYSTORE_PASSWORD，CI 里没有。
      # 这里现生成一个自签调试库覆盖仓库自带的 key-store.jks，别名必须叫 FCL-Key。
      - name: Provide signing keystore
        run: |
          # 仓库自带的 key-store.jks 密码未知，keytool 会尝试打开它而报密码错误，先删掉
          rm -f key-store.jks
          keytool -genkeypair -v \
            -keystore key-store.jks \
            -storepass lumenbuild -keypass lumenbuild \
            -alias FCL-Key -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Lumen Debug, O=Lumen, C=CN"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        env:
          FCL_KEYSTORE_PASSWORD: lumenbuild
          CURSE_API_KEY: ""
          OAUTH_API_KEY: ""
        run: ./gradlew :FCL:assembleDebug --no-daemon --stacktrace -Darch=arm64 -Dorg.gradle.jvmargs=-Xmx4g

      # 同时发布到 Releases：artifact 有账号级下载额度，Releases 走另一条通道
      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: 男娘启动器 beta-${{ github.run_number }}
          body: |
            自动构建 · 提交 ${{ github.sha }}
          files: FCL/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FCL-debug-apk
          path: FCL/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
